# docker compose up --build        -> starts minio, creates the bucket, starts api + worker
# docker compose run --rm api pytest -> runs all tests (no API keys needed)
#
# Values like ${API_TOKENS:-dev-token} come from your .env file (or the default after ":-").

x-app: &app
  build: .
  image: broll-engine:local
  environment: &app-env
    # Fixed for containers: storage is MinIO, database is in the shared volume.
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    S3_BUCKET: ${S3_BUCKET:-broll}
    S3_REGION: ${S3_REGION:-us-east-1}
    DATABASE_URL: sqlite:////app/data/broll.db
    WORK_DIR: /app/data/work
    LOCAL_STORAGE_DIR: /app/data/storage
    # Taken from .env (defaults are for local testing only):
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    API_TOKENS: ${API_TOKENS:-dev-token}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    FILE_LINK_SECRET: ${FILE_LINK_SECRET:-change-me-file-link-secret}
    FILE_LINK_TTL_SECONDS: ${FILE_LINK_TTL_SECONDS:-3600}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    ALLOWED_AUDIO_EXTENSIONS: ${ALLOWED_AUDIO_EXTENSIONS:-mp3,wav,m4a}
    CALLBACK_SECRET: ${CALLBACK_SECRET:-change-me-callback-secret}
    CALLBACK_MAX_RETRIES: ${CALLBACK_MAX_RETRIES:-3}
    CALLBACK_BACKOFF_SECONDS: ${CALLBACK_BACKOFF_SECONDS:-1.0}
    CALLBACK_TIMEOUT_SECONDS: ${CALLBACK_TIMEOUT_SECONDS:-10.0}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1.0}
    # Pipeline. Defaults = mock adapters, so Docker/CI need no models or keys.
    # Put TTS_PROVIDER=kokoro / TRANSCRIBE_PROVIDER=whisper in .env for real voices + transcripts.
    KEEP_WORK_FILES: ${KEEP_WORK_FILES:-false}
    MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-600}
    MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-100}
    DOWNLOAD_TIMEOUT_SECONDS: ${DOWNLOAD_TIMEOUT_SECONDS:-60}
    TTS_PROVIDER: ${TTS_PROVIDER:-mock}
    KOKORO_SPEED: ${KOKORO_SPEED:-1.0}
    TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-mock}
    WHISPER_MODEL: ${WHISPER_MODEL:-small}
    WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
    MIN_SCENE_SECONDS: ${MIN_SCENE_SECONDS:-2.0}
    MAX_SCENE_SECONDS: ${MAX_SCENE_SECONDS:-8.0}
    VIDEO_PRESET: ${VIDEO_PRESET:-veryfast}
    VIDEO_CRF: ${VIDEO_CRF:-23}
    # Understanding + footage + ranking. Defaults = mock (no keys, no network) for Docker/CI.
    # For real footage put the real values in .env (see .env.example).
    UNDERSTAND_PROVIDER: ${UNDERSTAND_PROVIDER:-mock}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
    PROVIDER_ORDER: ${PROVIDER_ORDER:-mock,generated}
    PROVIDERS_DISABLED: ${PROVIDERS_DISABLED:-}
    PROVIDERS_OVERRIDE_FILE: /app/data/providers_override.json
    PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-broll-engine/0.3 (set WIKIMEDIA_USER_AGENT to include your email or project URL)}
    RANK_SCORER: ${RANK_SCORER:-mock}
    STOCK_MIN_SCORE: ${STOCK_MIN_SCORE:-0.22}
    SEED: ${SEED:-1234}
    ALLOW_PRIVATE_URLS: "false"
  volumes:
    - app-data:/app/data       # SQLite file + temp work files, shared by api and worker
    - model-cache:/models      # downloaded AI models, kept between runs

services:
  minio:
    # Official MinIO images are no longer published; pgsty/minio is a maintained
    # community build of the same server (AGPL - used only as the storage service).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

  minio-init:
    <<: *app
    command: python scripts/create_bucket.py
    depends_on:
      - minio
    restart: "no"

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: python -m app.worker
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  app-data:
  model-cache:
  minio-data:
