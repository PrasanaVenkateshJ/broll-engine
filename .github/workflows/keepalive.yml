# Every 6 hours: call the live Space's /health, so the free Space keeps getting traffic and does not
# go to sleep during the review period. The URL comes from the repository VARIABLE SPACE_URL
# (GitHub -> Settings -> Secrets and variables -> Actions -> Variables), e.g.
# https://<hf-username>-broll-studio.hf.space . Not set -> the job skips itself and passes.
name: keepalive

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC (minute 17: less crowded than :00)
  workflow_dispatch:          # "Run workflow" button, to test it by hand

permissions: {}               # needs no access to the repository at all

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GET /health
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "Repository variable SPACE_URL is not set: nothing to ping, skipping."
            exit 0
          fi
          # A sleeping Space can take minutes to wake: retry a few times before failing.
          curl -fsS --retry 5 --retry-delay 60 --retry-all-errors --max-time 60 "${SPACE_URL%/}/health"
          echo
