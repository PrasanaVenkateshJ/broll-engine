# DISABLED ON PURPOSE (no schedule). It was written for the Hugging Face Space, which slept when idle.
# The live demo now runs on Modal, which bills every second a container is up: a ping every 6 hours would
# start a container each time and keep it up for MODAL_SCALEDOWN_SECONDS (600 s) = ~40 minutes of paid
# idle time a day, for nothing (Modal starts a container on the first real request anyway).
# It can only be run by hand ("Run workflow"), and it refuses Modal URLs (*.modal.run).
name: keepalive

on:
  workflow_dispatch:          # manual only - there is deliberately NO "schedule:" trigger

permissions: {}               # needs no access to the repository at all

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GET /health (never against Modal)
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "Repository variable SPACE_URL is not set: nothing to ping, skipping."
            exit 0
          fi
          case "$SPACE_URL" in
            *modal.run*) echo "SPACE_URL is a Modal URL: pinging it would cost credits. Skipping."; exit 0;;
          esac
          curl -fsS --retry 5 --retry-delay 60 --retry-all-errors --max-time 60 "${SPACE_URL%/}/health"
          echo
